<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat WebSocket</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        #chat { width: 100%; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        #message { width: 80%; }
    </style>
</head>
<body>
    <h2>Chat en tiempo real</h2>
    <div id="chat"></div>
    <input id="username" placeholder="Nombre de usuario" />
    <br><br>
    <input id="message" placeholder="Escribe tu mensaje" />
    <button onclick="sendMessage()">Enviar</button>

    <script>
        const ws = new WebSocket(`wss://${location.host}/ws`);
        const chat = document.getElementById("chat");

        ws.onmessage = (event) => {
            const msg = document.createElement("div");
            msg.textContent = event.data;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        };

        function sendMessage() {
            const user = document.getElementById("username").value || "Anónimo";
            const message = document.getElementById("message").value;
            if (message.trim()) {
                ws.send(`${user}: ${message}`);
                document.getElementById("message").value = "";
            }
        }
    </script>
</body>
</html>
